name: Run Telegram Bot

on:
  schedule:
    # 04:17 AM San Luis Río Colorado (UTC-7) = 11:17 UTC
    # Se usa :17 para reducir retrasos de GitHub Actions
    # que suelen ocurrir al inicio de cada hora.
    - cron: '17 11 * * *'

  # Permite ejecutar manualmente desde GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ======================================================
      # 3. MOSTRAR HORA DE EJECUCIÓN
      # ======================================================
      - name: Show execution time
        run: |
          echo "========================================"
          echo "Telegram News Bot"
          echo "========================================"
          echo "UTC time:"
          date -u
          echo ""
          echo "Runner time:"
          date
          echo "========================================"


      # ======================================================
      # 4. INSTALAR DEPENDENCIAS
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests deep-translator


      # ======================================================
      # 5. EJECUTAR BOT
      # ======================================================
      - name: Run Telegram Bot
        run: python telegram_bot.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}


      # ======================================================
      # 6. GUARDAR HISTORIAL DE NOTICIAS
      # ======================================================
      - name: Save sent news history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking noticias_enviadas.json..."

          git add noticias_enviadas.json

          if git diff --cached --quiet; then
            echo "No changes in noticias_enviadas.json"
            exit 0
          fi

          echo "Changes detected."

          git commit -m "Update sent news history"

          echo "Updating local repository..."
          git pull --rebase origin main

          echo "Pushing updated history..."
          git push origin HEAD:main

          echo "Sent news history successfully updated."
